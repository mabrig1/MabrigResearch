services:
  # ── Backend API ──────────────────────────────────────────────
  - type: web
    name: mabrig-backend
    runtime: node
    rootDir: mabrig-backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure value
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PAYSTACK_SECRET
        sync: false          # set manually in Render dashboard
      - key: CLIENT_URL
        value: https://mabrigresearch.online

  # ── Frontend Static Site ─────────────────────────────────────
  - type: web
    name: mabrig-frontend
    runtime: static
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
