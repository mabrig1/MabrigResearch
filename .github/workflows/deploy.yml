name: Deploy Mabrig Research

on:
  push:
    branches: [main]

jobs:
  # ── Validate backend ───────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mabrig-backend/package.json

      - name: Install dependencies
        run: npm install
        working-directory: mabrig-backend

      - name: Check for syntax errors
        run: node --check server.js
        working-directory: mabrig-backend

  # ── Deploy frontend to Vercel ──────────────────────────────────
  deploy-frontend:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (production)
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # GitHub Secrets needed:
        #   VERCEL_TOKEN      → vercel.com → Account Settings → Tokens
        #   VERCEL_ORG_ID     → vercel.com → Settings → General → Team ID
        #   VERCEL_PROJECT_ID → vercel.com → Project → Settings → General

  # ── Deploy backend to Railway ──────────────────────────────────
  deploy-backend:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service mabrig-backend --detach
        working-directory: mabrig-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # GitHub Secrets needed:
        #   RAILWAY_TOKEN → railway.app → Account Settings → Tokens → New Token
