name: Deploy Mabrig Research

on:
  push:
    branches: [main]

jobs:
  # ── Lint & basic checks ────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mabrig-backend/package.json

      - name: Install dependencies
        run: npm install
        working-directory: mabrig-backend

      - name: Check for syntax errors
        run: node --check server.js
        working-directory: mabrig-backend

  # ── Deploy backend to Render ───────────────────────────────────
  deploy-backend:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
        # Set RENDER_BACKEND_DEPLOY_HOOK in GitHub repo secrets
        # Get it from: Render dashboard → service → Settings → Deploy Hook

  # ── Deploy frontend to Netlify ─────────────────────────────────
  deploy-frontend:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=. --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        # Set NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID in GitHub repo secrets
        # Get them from: Netlify dashboard → User settings → Personal access tokens
