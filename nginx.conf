# Nginx configuration for mabrigresearch.online
# Place at: /etc/nginx/sites-available/mabrig
# Then: sudo ln -s /etc/nginx/sites-available/mabrig /etc/nginx/sites-enabled/

# ── Frontend ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name mabrigresearch.online www.mabrigresearch.online;

    root /var/www/mabrig;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ── Backend API ───────────────────────────────────────────────────
server {
    listen 80;
    server_name api.mabrigresearch.online;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Upload file size limit (match multer 20MB)
        client_max_body_size 25M;
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
}

